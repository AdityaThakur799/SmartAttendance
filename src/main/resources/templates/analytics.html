<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Analytics — SmartLog</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
          --bg:#eef3f8;
          --card:#ffffff;
          --accent:#2b9cff;
          --text:#111827;
          --muted:#6b7280;
          --radius:14px;
          --shadow:0 12px 24px rgba(18,38,63,0.06);
          --sidebar-border:#e6eef7;
        }

        :root[data-theme="dark"] {
          --bg:#050505;
          --card:#0f0f0f;
          --accent:#2b9cff;
          --text:#e6eef8;
          --muted:#94a3b8;
          --shadow:none;
          --sidebar-border:rgba(255,255,255,0.03);
        }

        body {
          background: var(--bg);
          color: var(--text);
          margin: 0;
          font-family: Inter, Arial;
        }

        .app {
          display: grid;
          grid-template-columns: 260px 1fr;
          gap: 22px;
          min-height: 100vh;
          padding:18px;
        }

        /* SIDEBAR EXACT SAME AS STUDENTS PAGE */
        .sidebar{
          width:260px;
          background:var(--card);
          padding:28px 20px;
          border-right:1px solid var(--sidebar-border);
          display:flex;
          flex-direction:column;
          gap:14px;
          border-radius:12px;
          box-shadow:var(--shadow);
        }

        .brand{
          font-weight:700;
          color:var(--accent);
          font-size:22px;
        }

        .nav{
          margin-top:8px;
          display:flex;
          flex-direction:column;
          gap:8px;
        }

        .nav button{
          border:0;
          background:transparent;
          text-align:left;
          padding:10px 12px;
          border-radius:10px;
          color:var(--text);
          cursor:pointer;
          font-size:15px;
          display:flex;
          gap:12px;
          align-items:center;
        }

        .nav button:hover{
          background:rgba(43,156,255,0.08);
          color:var(--accent);
        }

        .nav .active{
          background:linear-gradient(90deg,var(--accent),#6fb8ff);
          color:white;
        }

        /* MAIN AREA */
        .main {
          padding: 26px 28px;
        }

        /* CARDS SAME STYLE */
        .card {
          background: var(--card);
          padding: 18px;
          box-shadow: var(--shadow);
          border-radius: var(--radius);
          margin-bottom:25px;
        }

        /* STAT CARDS MATCHED */
        .stat-row{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:18px;
            margin-bottom:25px;
        }

        .stat-card{
            background: var(--card);
            padding: 18px;
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            text-align:center;
        }

        .stat-big{
            font-size:28px;
            font-weight:800;
            color:var(--accent);
        }

        .stat-label{
            font-size:14px;
            color:var(--muted);
        }

        /* TABLE STYLE SAME AS STUDENTS PAGE */
        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 10px;
        }

        th, td {
          padding: 12px;
          border-bottom: 1px solid rgba(0,0,0,0.05);
          text-align: left;
        }

        th {
          color: var(--muted);
          font-size: 13px;
        }

        .view-btn{
            padding:6px 14px;
            background:var(--accent);
            color:white;
            border-radius:8px;
            text-decoration:none;
            font-size:13px;
        }

        .view-btn:hover{
            background:#1584d4;
        }

        .chart-wrapper{
            width:100%;
            height:300px;
        }

        .chart-wrapper canvas{
            width:100% !important;
            height:100% !important;
        }

        /* MODAL SAME LOOK */
        #studentModal {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.35);
            z-index:9999;
            align-items:center;
            justify-content:center;
        }
    </style>
</head>
<body>

<script>
    const savedTheme = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);
</script>

<!-- MODAL SAME STYLE -->
<div id="studentModal">
    <div style="width:900px;max-width:95%;background:var(--card);padding:20px;border-radius:14px;box-shadow:var(--shadow);position:relative;">
        <button id="studentModalClose" style="position:absolute;top:14px;right:14px;font-size:20px;border:none;background:none;cursor:pointer;">✕</button>

        <h3 id="s-name" style="margin:0;"></h3>
        <div id="s-roll" style="color:var(--muted);margin-bottom:10px;"></div>

        <div style="display:grid;grid-template-columns:1fr 350px;gap:20px;">
            <div>
                <h4>Monthly Attendance</h4>
                <div class="chart-wrapper" style="height:230px;">
                    <canvas id="studentMonthlyChart"></canvas>
                </div>
            </div>

            <div>
                <h4>Summary</h4>
                <div class="chart-wrapper" style="height:200px;">
                    <canvas id="studentPieChart"></canvas>
                </div>
                <div style="margin-top:12px;">
                    Present: <b id="tot-present"></b><br>
                    Absent: <b id="tot-absent"></b><br>
                    Late: <b id="tot-late"></b>
                </div>
            </div>
        </div>

    </div>
</div>

<div class="app">

    <!-- SIDEBAR SAME -->
    <aside class="sidebar">
        <div class="brand">SmartLog</div>

        <nav class="nav">
            <button onclick="location.href='/dashboard'">🏠 Dashboard</button>
            <button class="active">📈 Analytics</button>
            <button onclick="location.href='/time'">⏱ Time Management</button>
            <button onclick="location.href='/students'">👥 Students</button>
            <button onclick="location.href='/attendance'">📅 Attendance</button>
            <button onclick="location.href='/approval'">✔ Approval</button>
        </nav>

        <div style="margin-top:auto;color:var(--muted);font-size:13px">
            Logged in as <strong>Admin</strong><br>
            <small>Smart Attendance</small>
        </div>
    </aside>

    <main class="main">

        <!-- SUMMARY -->
        <div class="stat-row">
            <div class="stat-card">
                <div class="stat-big" id="sum-present">0</div>
                <div class="stat-label">Present</div>
            </div>

            <div class="stat-card">
                <div class="stat-big" id="sum-late">0</div>
                <div class="stat-label">Late</div>
            </div>

            <div class="stat-card">
                <div class="stat-big" id="sum-absent">0</div>
                <div class="stat-label">Absent</div>
            </div>
        </div>

        <!-- DAILY CHART -->
        <div class="card">
            <h3>Daily Attendance Chart</h3>
            <div class="chart-wrapper">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <!-- STUDENTS ANALYTICS -->
        <div class="card">
            <h3>Students Analytics</h3>

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="analytics-students"></tbody>
            </table>
        </div>

    </main>
</div>


<script>

    /* ----------- CSS Helpers ----------- */
    function cssVar(v){
        return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    }

    function rgba(hex,alpha){
        if(!hex.startsWith("#")) hex = "#2b9cff";
        const r = parseInt(hex.substr(1,2),16);
        const g = parseInt(hex.substr(3,2),16);
        const b = parseInt(hex.substr(5,2),16);
        return `rgba(${r},${g},${b},${alpha})`;
    }

    /* ----------- FETCHER ----------- */
    async function get(url){
        try{
            const r = await fetch(url,{cache:"no-store"});
            return await r.json();
        }catch(e){
            console.error("API error:", url);
            return null;
        }
    }

    /* ----------- LOAD STUDENTS TABLE ----------- */
    async function loadStudents(){
        const data = await get("/api/students");
        const tbody = document.getElementById("analytics-students");

        tbody.innerHTML = "";

        data.forEach(s=>{
            tbody.innerHTML += `
                <tr>
                    <td>${s.rollNo}</td>
                    <td>${s.name}</td>
                    <td><a href="#" class="view-btn" onclick="openStudent(${s.id})">View</a></td>
                </tr>
            `;
        });
    }

    /* ----------- SITE SUMMARY + GRAPH ----------- */
    let dailyChart = null;

    async function loadSummary(){

        const sum = await get("/api/analytics/summary");

        document.getElementById("sum-present").innerText = sum.present;
        document.getElementById("sum-late").innerText = sum.late;
        document.getElementById("sum-absent").innerText = sum.absent;

        const daily = await get("/api/analytics/daily");
        const labels = daily.map(d=>d.date);
        const counts = daily.map(d=>d.count);

        const accent = cssVar("--accent");

        if(dailyChart) dailyChart.destroy();

        dailyChart = new Chart(document.getElementById("monthlyChart"),{
            type:"bar",
            data:{
                labels:labels.slice(-30),
                datasets:[{
                    label:"Present Count",
                    data:counts.slice(-30),
                    backgroundColor: rgba(accent,0.5),
                    borderColor: accent,
                    borderWidth: 1
                }]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false,
                scales:{
                    y:{beginAtZero:true, suggestedMax:10},
                    x:{ticks:{autoSkip:true, maxRotation:0}}
                }
            }
        });
    }

    /* ----------- STUDENT MODAL ----------- */

    let smc = null;
    let spc = null;

    async function openStudent(id){
        document.getElementById("studentModal").style.display = "flex";

        const data = await get(`/api/analytics/student/${id}`);

        document.getElementById("s-name").innerText = data.name;
        document.getElementById("s-roll").innerText = `(${data.rollNo})`;

        const months = data.monthlySummary.map(m=>m.month);
        const presents = data.monthlySummary.map(m=>m.present);

        const accent = cssVar("--accent");

        if(smc) smc.destroy();

        smc = new Chart(document.getElementById("studentMonthlyChart"),{
            type:"bar",
            data:{
                labels: months,
                datasets:[{
                    label:"Present (%)",
                    data: presents,
                    backgroundColor: rgba(accent,0.5),
                    borderColor: accent,
                    borderWidth: 1
                }]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false,
                scales:{
                    y:{beginAtZero:true, suggestedMax:30},
                    x:{ticks:{autoSkip:false}}
                }
            }
        });

        document.getElementById("tot-present").innerText = data.totals.present;
        document.getElementById("tot-absent").innerText = data.totals.absent;
        document.getElementById("tot-late").innerText = data.totals.late;

        if(spc) spc.destroy();

        spc = new Chart(document.getElementById("studentPieChart"),{
            type:"pie",
            data:{
                labels:["Present","Absent","Late"],
                datasets:[{
                    data:[
                        data.totals.present,
                        data.totals.absent,
                        data.totals.late
                    ],
                    backgroundColor:[
                        accent,
                        "rgba(255,0,0,0.6)",
                        "rgba(255,165,0,0.9)"
                    ]
                }]
            },
            options:{responsive:true, maintainAspectRatio:false}
        });
    }

    document.getElementById("studentModalClose").onclick = ()=>{
        document.getElementById("studentModal").style.display = "none";
        if(smc) smc.destroy();
        if(spc) spc.destroy();
    };

    window.onload = async ()=>{
        await loadStudents();
        await loadSummary();
    };
</script>

</body>
</html>
