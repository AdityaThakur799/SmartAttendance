<!doctype html>
<html lang="en" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SmartLog — Dashboard</title>

    <style>
        :root{
          --bg:#eef3f8;
          --card:#ffffff;
          --accent:#2b9cff;
          --muted:#6b7280;
          --text:#0f1724;
          --radius:14px;
          --shadow: 0 12px 24px rgba(18,38,63,0.06);
        }
        :root[data-theme="dark"]{
          --bg:#050505;
          --card:#0f0f0f;
          --accent:#2b9cff;
          --muted:#94a3b8;
          --text:#e6eef8;
          --shadow:none;
        }

        *{box-sizing:border-box}
        body{
          margin:0;
          font-family:Inter, system-ui;
          background:var(--bg);
          color:var(--text);
          display:flex;
          min-height:100vh;
        }

        /* SIDEBAR */
        .sidebar{
          width:260px;
          background:var(--card);
          padding:28px 20px;
          border-right:1px solid rgba(0,0,0,0.06);
          display:flex;
          flex-direction:column;
          gap:14px;
        }
        .brand{font-weight:700;color:var(--accent);font-size:22px;}
        .nav{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
        .nav button{
          border:0;background:transparent;padding:10px 12px;border-radius:10px;
          color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;gap:12px;
        }
        .nav button:hover{background:rgba(43,156,255,0.1);}
        .nav .active{background:var(--accent);color:white;}

        /* MAIN */
        .main{flex:1;display:flex;flex-direction:column;overflow-y:auto;}
        .header{
          display:flex;justify-content:space-between;align-items:center;
          padding:18px 26px;position:sticky;top:0;background:var(--bg);z-index:10;
        }

        .search{position:relative;width:420px;}
        .search input{
          width:100%;padding:12px 16px;border-radius:40px;
          border:1px solid rgba(0,0,0,0.08);font-size:15px;
        }

        .search-results{
          position:absolute;top:48px;width:100%;background:white;
          border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,0.1);
          display:none;z-index:9999;
        }
        .search-item{
          padding:10px 14px;cursor:pointer;font-size:14px;
          border-bottom:1px solid #f1f1f1;
        }
        .search-item:hover{background:#eef6ff;}

        .header-actions{display:flex;gap:10px;align-items:center;}
        .btn{padding:9px 14px;border-radius:12px;border:0;font-weight:600;cursor:pointer;}
        .btn-soft{background:var(--card);border:1px solid rgba(0,0,0,0.05);}
        .btn-primary{background:var(--accent);color:white;}

        .content{
          padding:22px 26px 40px;
          display:grid;grid-template-columns:1fr 360px;gap:22px;
        }

        .left{
          display:grid;
          grid-template-columns:repeat(12,1fr);
          gap:18px;
          align-items:start;
        }

        .card{
          background:var(--card);
          border-radius:var(--radius);
          padding:18px;
          box-shadow:var(--shadow);
        }

        .stat{
          background:#fff;padding:14px;border-radius:12px;
          box-shadow:0 6px 14px rgba(12,40,80,0.05);
        }

        .label{font-size:13px;color:var(--muted);font-weight:600;}
        .value{font-size:22px;color:var(--accent);font-weight:800;}

        .chart-card{
          background:var(--card);
          border-radius:var(--radius);
          padding:12px 14px;
          box-shadow:var(--shadow);
        }

        .chart-title{font-weight:700;margin-bottom:6px;font-size:16px;}

        /* RIGHT SIDE */
        .right{display:flex;flex-direction:column;gap:18px;}

        .feed{max-height:330px;overflow-y:auto;}
        .event{display:flex;gap:12px;padding:8px 0;}
        .time{font-size:12px;color:var(--muted);min-width:60px;}
        .txt{font-size:14px;font-weight:600;}

        /* TOOLTIP */
        .chart-tooltip{
          position:fixed;
          pointer-events:none;
          background:#0f1724;
          color:white;
          padding:6px 8px;
          border-radius:6px;
          font-size:13px;
          transform:translate(-50%,-130%);
          display:none;
          z-index:9999;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="brand">SmartLog</div>
    <nav class="nav">
        <button class="active">🏠 Dashboard</button>
        <button onclick="location.href='/analytics'">📈 Analytics</button>
        <button onclick="location.href='/time'">⏱ Time Management</button>
        <button onclick="location.href='/students'">👥 Students</button>
        <button onclick="location.href='/attendance'">🗓 Attendance</button>
        <button onclick="location.href='/approval'">✔ Approval</button>
    </nav>
    <div style="margin-top:auto;color:var(--muted);font-size:13px">
        Logged in as <strong>Admin</strong><br>
        <small>Smart Attendance</small>
    </div>
</aside>

<!-- MAIN -->
<main class="main">
    <header class="header">

        <!-- SEARCH -->
        <div class="search">
            <input id="searchInput" placeholder="Search student, ID or details..." autocomplete="off"/>
            <div id="searchResults" class="search-results"></div>
        </div>

        <div class="header-actions">

            <button class="btn btn-primary" onclick="location.href='/qrscanner'">📷 QR Scanner</button>
        </div>
    </header>

    <section class="content">
        <div class="left">

            <!-- STATS -->
            <div class="card" style="grid-column: span 12; display:grid; grid-template-columns:repeat(4,1fr); gap:14px;">
                <div class="stat"><div class="label">Present Today</div><div class="value" th:text="${todayPresent}">0</div></div>
                <div class="stat"><div class="label">Absent Today</div><div class="value" th:text="${todayAbsent}">0</div></div>
                <div class="stat"><div class="label">Late Today</div><div class="value" th:text="${todayLate}">0</div></div>
                <div class="stat"><div class="label">Total Students</div><div class="value" th:text="${totalStudents}">0</div></div>
            </div>

            <!-- TREND CHART (HEIGHT = 330px) -->
            <div class="chart-card" style="grid-column: span 8;">
                <div class="chart-title">Attendance Trend (Last 8 weeks)</div>
                <canvas id="trendCanvas" width="900" height="330" style="width:100%;height:330px;"></canvas>
                <div style="position:absolute;right:14px;top:14px;font-size:12px;color:var(--muted);">Auto scaled</div>
            </div>

            <!-- MONTHLY CHART (HEIGHT = 330px) -->
            <div class="chart-card" style="grid-column: span 4;">
                <div class="chart-title">Monthly Attendance (Last 6 months)</div>
                <canvas id="barCanvas" width="900" height="330" style="width:100%;height:330px;"></canvas>
            </div>

        </div>

        <!-- RIGHT SIDE -->
        <aside class="right">

            <!-- TOP STUDENTS -->
            <div class="card">
                <div style="display:flex;justify-content:space-between;">
                    <div style="font-weight:700">Top Attendance Students</div>
                    <div style="color:var(--muted);font-size:13px">This month</div>
                </div>

                <table style="width:100%;margin-top:10px;font-size:14px">
                    <thead style="color:var(--muted)">
                    <tr>
                        <th>#</th><th>Name</th><th>ID</th>
                        <th style="text-align:right">%</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s, i : ${topStudents}">
                        <td th:text="${i.index+1}">1</td>
                        <td th:text="${s.name}">Name</td>
                        <td th:text="${s.rollNo}">ID</td>
                        <td style="text-align:right" th:text="${s.percent} + '%'">0%</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- ACTIVITY FEED -->
            <div class="card">
                <div style="display:flex;justify-content:space-between;">
                    <div style="font-weight:700">Activity Feed</div>
                    <div style="color:var(--muted);font-size:13px">Live</div>
                </div>

                <div class="feed">
                    <div class="event" th:each="msg : ${activityFeed}">
                        <div class="time">Now</div>
                        <div class="txt" th:text="${msg}">Activity</div>
                    </div>
                </div>
            </div>

        </aside>
    </section>
</main>

<!-- TOOLTIP -->
<div id="chartTooltip" class="chart-tooltip"></div>

<!-- JS START -->
<script th:inline="javascript">

    /* =========================================
       SEARCH BAR
    ========================================= */
    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");

    searchInput.addEventListener("input", async function () {
        const q = this.value.trim();
        if(q.length === 0){
            searchResults.style.display = "none";
            return;
        }
        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            searchResults.innerHTML = "";

            if(!Array.isArray(data) || data.length === 0){
                searchResults.style.display = "none";
                return;
            }

            data.forEach(stu=>{
                const item = document.createElement("div");
                item.className = "search-item";
                item.innerHTML = `<strong>${stu.name}</strong> — ${stu.rollNo}`;
                item.onclick = ()=>{ window.location.href = `/students/${stu.id}` };
                searchResults.appendChild(item);
            });
            searchResults.style.display = "block";
        } catch (err){
            searchResults.style.display = "none";
        }
    });

    document.addEventListener("click", (e)=>{
        if(!searchInput.contains(e.target)) searchResults.style.display = "none";
    });



    /* =========================================
       GET BACKEND DATA SAFELY
    ========================================= */
    let trendWeeks = /*[[${weeklyHeatmap}]]*/ [];
    let monthly = /*[[${monthlyChart}]]*/ [];

    if(!Array.isArray(trendWeeks) || trendWeeks.length === 0)
        trendWeeks = [0,0,0,0,0,0,0,0];

    if(!Array.isArray(monthly) || monthly.length === 0)
        monthly = [0,0,0,0,0,0];



    /* =========================================
       LABEL HELPERS
    ========================================= */
    function lastNWeekLabels(n){
        const now = new Date();
        const arr=[];
        for(let i=n-1;i>=0;i--){
            const d = new Date();
            d.setDate(now.getDate() - i*7);
            arr.push(`${d.getMonth()+1}/${d.getDate()}`);
        }
        return arr;
    }

    function lastNMonthLabels(n){
        const now = new Date();
        const arr=[];
        for(let i=n-1;i>=0;i--){
            const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
            arr.push(d.toLocaleString("en",{month:"short"}));
        }
        return arr;
    }



    /* =========================================
       TOOLTIP
    ========================================= */
    const tooltip = document.getElementById("chartTooltip");
    function showTooltip(x,y,html){
        tooltip.style.left = x+"px";
        tooltip.style.top = y+"px";
        tooltip.innerHTML = html;
        tooltip.style.display = "block";
    }
    function hideTooltip(){ tooltip.style.display="none"; }



    /* =========================================
       TREND CHART — HEIGHT 330PX
    ========================================= */
    (function(){
        const canvas = document.getElementById("trendCanvas");
        const ctx = canvas.getContext("2d");

        function resize(){
            const dpr = window.devicePixelRatio || 1;
            const r = canvas.getBoundingClientRect();
            canvas.width = r.width * dpr;
            canvas.height = r.height * dpr;
            ctx.setTransform(dpr,0,0,dpr,0,0);
        }
        resize();
        window.addEventListener("resize", ()=>{ resize(); draw(1); });

        const labels = lastNWeekLabels(trendWeeks.length);
        let start = null;
        const duration = 900;

        function compute(p){
            const r = canvas.getBoundingClientRect();
            const w = r.width, h = r.height;

            const pad = {left:52,right:18,top:20,bottom:36};
            const innerW = w - pad.left - pad.right;
            const innerH = h - pad.top - pad.bottom;

            const maxVal = Math.max(...trendWeeks,1);

            const pts = trendWeeks.map((v,i)=>{
                const x = pad.left + (i/(trendWeeks.length-1)) * innerW;
                const y = pad.top + (1 - (v/maxVal)*p) * innerH;
                return {x,y,val:v};
            });

            return {w,h,pad,maxVal,pts};
        }

        function axes(ctx,w,h,p,max){
            ctx.save();
            ctx.strokeStyle="rgba(0,0,0,0.08)";
            ctx.font="12px Inter";
            ctx.fillStyle="rgba(0,0,0,0.5)";

            for(let i=0;i<=4;i++){
                const y = p.top + (i/4) * (h - p.top - p.bottom);
                ctx.beginPath();
                ctx.moveTo(p.left,y);
                ctx.lineTo(w - p.right,y);
                ctx.stroke();
                ctx.fillText(Math.round((1 - i/4)*max),8,y+4);
            }

            const xStep = (w - p.left - p.right)/(labels.length-1);
            labels.forEach((lab,i)=>{
                ctx.fillText(lab, p.left + i*xStep, h - p.bottom + 10);
            });

            ctx.restore();
        }

        function smooth(ctx, pts){
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            const t = 0.25;
            for(let i=0;i<pts.length-1;i++){
                const p0=pts[i], p1=pts[i+1];
                const prev = pts[i-1] || p0;
                const next = pts[i+2] || p1;

                const cp1x = p0.x + (p1.x - prev.x)*t;
                const cp1y = p0.y + (p1.y - prev.y)*t;
                const cp2x = p1.x - (next.x - p0.x)*t;
                const cp2y = p1.y - (next.y - p0.y)*t;

                ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,p1.x,p1.y);
            }
            ctx.stroke();
        }

        function draw(p){
            const {w,h,pad,maxVal,pts} = compute(p);
            ctx.clearRect(0,0,w,h);

            axes(ctx,w,h,pad,maxVal);

            ctx.save();
            const g=ctx.createLinearGradient(0,pad.top,0,h-pad.bottom);
            g.addColorStop(0,"rgba(43,156,255,0.18)");
            g.addColorStop(1,"rgba(43,156,255,0.02)");
            ctx.beginPath();
            ctx.moveTo(pts[0].x,h-pad.bottom);
            pts.forEach((pt,i)=>{
                if(i===0) ctx.lineTo(pt.x,pt.y);
                else {
                    const midX = (pts[i-1].x + pt.x)/2;
                    const midY = (pts[i-1].y + pt.y)/2;
                    ctx.quadraticCurveTo(pts[i-1].x,pts[i-1].y,midX,midY);
                }
            });
            ctx.lineTo(pts[pts.length-1].x,h-pad.bottom);
            ctx.closePath();
            ctx.fillStyle=g;
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.lineWidth=2.6;
            ctx.strokeStyle="#2b9cff";
            smooth(ctx,pts);
            ctx.restore();

            pts.forEach(p=>{
                ctx.beginPath();
                ctx.arc(p.x,p.y,4.2,0,Math.PI*2);
                ctx.fillStyle="#fff";
                ctx.strokeStyle="#2b9cff";
                ctx.lineWidth=2;
                ctx.fill();
                ctx.stroke();
            });
        }

        function anim(ts){
            if(!start) start = ts;
            const p = Math.min((ts - start)/duration, 1);
            draw(p);
            if(p < 1) requestAnimationFrame(anim);
        }

        canvas.addEventListener("mousemove", e=>{
            const r = canvas.getBoundingClientRect();
            const {pts} = compute(1);
            const mx = e.clientX - r.left;
            const my = e.clientY - r.top;

            let best=null, bestD=9999;
            pts.forEach((pt,i)=>{
                const d = Math.hypot(mx-pt.x,my-pt.y);
                if(d < bestD){ bestD=d; best={pt,i}; }
            });

            if(best && bestD < 12){
                showTooltip(e.clientX,e.clientY,
                    `<strong>${labels[best.i]}</strong>: ${best.pt.val}`);
            } else hideTooltip();
        });

        canvas.addEventListener("mouseleave", hideTooltip);

        requestAnimationFrame(anim);
    })();



    /* =========================================
       MONTHLY BAR CHART — HEIGHT 330PX
    ========================================= */
    (function(){
        const canvas = document.getElementById("barCanvas");
        const ctx = canvas.getContext("2d");

        function resize(){
            const dpr = window.devicePixelRatio || 1;
            const r = canvas.getBoundingClientRect();
            canvas.width = r.width * dpr;
            canvas.height = r.height * dpr;
            ctx.setTransform(dpr,0,0,dpr,0,0);
        }
        resize();
        window.addEventListener("resize", ()=>{ resize(); draw(1); });

        const labels = lastNMonthLabels(monthly.length);
        const duration = 800;
        let start=null;

        function draw(p){
            const r = canvas.getBoundingClientRect();
            const w=r.width, h=r.height;

            const pad={left:36,right:12,top:12,bottom:36};
            ctx.clearRect(0,0,w,h);

            const max = Math.max(...monthly,1);

            /* GRID */
            ctx.save();
            ctx.strokeStyle="rgba(0,0,0,0.08)";
            ctx.font="12px Inter";
            ctx.fillStyle="rgba(0,0,0,0.5)";
            for(let i=0;i<=3;i++){
                const y = pad.top + (i/3)*(h-pad.top-pad.bottom);
                ctx.beginPath();
                ctx.moveTo(pad.left,y);
                ctx.lineTo(w-pad.right,y);
                ctx.stroke();
                ctx.fillText(Math.round((1-i/3)*max),6,y+4);
            }
            ctx.restore();

            const count=monthly.length;
            const gap=14;
            const totalW = w-pad.left-pad.right;
            const barW = (totalW - gap*(count-1))/count;

            labels.forEach((lab,i)=>{
                const val = monthly[i];
                const x = pad.left + i*(barW+gap);
                const fullH = (val/max)*(h-pad.top-pad.bottom);
                const barH = fullH * p;
                const y = h - pad.bottom - barH;

                ctx.save();
                const g=ctx.createLinearGradient(x,y,x,y+barH);
                g.addColorStop(0,"#2b9cff");
                g.addColorStop(1,"#2b9cff");
                ctx.fillStyle=g;
                ctx.shadowColor="rgba(43,156,255,0.25)";
                ctx.shadowBlur=8;

                const r0=6;
                ctx.beginPath();
                ctx.moveTo(x+r0,y);
                ctx.lineTo(x+barW-r0,y);
                ctx.quadraticCurveTo(x+barW,y,x+barW,y+r0);
                ctx.lineTo(x+barW,y+barH-r0);
                ctx.quadraticCurveTo(x+barW,y+barH,x+barW-r0,y+barH);
                ctx.lineTo(x+r0,y+barH);
                ctx.quadraticCurveTo(x,y+barH,x,y+barH-r0);
                ctx.lineTo(x,y+r0);
                ctx.quadraticCurveTo(x,y,x+r0,y);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                ctx.fillStyle="rgba(0,0,0,0.6)";
                ctx.textAlign="center";
                ctx.fillText(lab, x+barW/2, h-pad.bottom+10);
            });
        }

        function anim(ts){
            if(!start) start = ts;
            const p = Math.min((ts - start)/duration,1);
            draw(p);
            if(p < 1) requestAnimationFrame(anim);
        }

        canvas.addEventListener("mousemove",e=>{
            const r = canvas.getBoundingClientRect();
            const mx = e.clientX - r.left;

            const pad={left:36,right:12,top:12,bottom:36};
            const count=monthly.length;
            const gap=14;
            const totalW = r.width - pad.left - pad.right;
            const barW = (totalW - gap*(count-1))/count;

            for(let i=0;i<count;i++){
                const x = pad.left + i*(barW+gap);
                if(mx >= x && mx <= x+barW){
                    showTooltip(e.clientX,e.clientY,
                        `<strong>${labels[i]}</strong>: ${monthly[i]}`);
                    return;
                }
            }
            hideTooltip();
        });

        canvas.addEventListener("mouseleave", hideTooltip);

        requestAnimationFrame(anim);
    })();




</script>

</body>
</html>
